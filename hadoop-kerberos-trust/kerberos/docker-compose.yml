# ============================================================
# 双 KDC 跨域互信（kerberos）
#   kdc1 -> realm EMR.1234.COM（模拟集群 A 的 KDC）
#   kdc2 -> realm EMR.6789.COM（模拟集群 B 的 KDC）
#
# 两个容器共用同一个 Dockerfile 与 start-kdc.sh 模板，
# 仅通过环境变量区分各自 realm / 对端 realm。
#
# 网络名固定为 hadoop-kerberos-net，供 hdfs/ 的 compose 以
# external 方式加入（与目录名无关，改名不影响部署）。
# ============================================================
version: '3.8'

services:
  kdc1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kdc1
    hostname: kdc1
    environment:
      REALM: EMR.1234.COM
      DOMAIN: emr.1234.com
      KDC_HOST: kdc1
      MASTER_PASSWORD: master1234
      REALM2: EMR.6789.COM
      DOMAIN2: emr.6789.com
      KDC_HOST2: kdc2
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /etc/localtime:/etc/localtime:ro  # 时钟同步（Kerberos 对时钟偏移敏感）
      - /etc/timezone:/etc/timezone:ro
      - /dev/pts:/dev/pts
    ports:
      - "88:88"    # KDC 端口
      - "749:749"  # kadmin 管理端口
    networks:
      kerberos-net:
        ipv4_address: 172.20.0.2

  kdc2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kdc2
    hostname: kdc2
    environment:
      REALM: EMR.6789.COM
      DOMAIN: emr.6789.com
      KDC_HOST: kdc2
      MASTER_PASSWORD: master6789
      REALM2: EMR.1234.COM
      DOMAIN2: emr.1234.com
      KDC_HOST2: kdc1
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /dev/pts:/dev/pts
    ports:
      - "89:88"    # 宿主 89 -> 容器 88，避免与 kdc1 冲突
      - "750:749"
    networks:
      kerberos-net:
        ipv4_address: 172.20.0.3

networks:
  kerberos-net:
    name: hadoop-kerberos-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
