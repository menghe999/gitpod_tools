# ============================================================
# ZooKeeper 单节点配置（HDFS HA 的 ZKFC 自动故障转移仲裁）
#
# 重要：必须显式写 clientPort=2181！
#   新版 zookeeper:3.8 官方镜像（3.8.6+）的入口脚本在 ZOO_SERVERS
#   只有一个 server 时不生成 clientPort，而 ZK 3.8 会把"仅一个 server"
#   判为非法配置（Invalid configuration, only one server specified）
#   并退回 standalone 模式 -> 2181 不会监听，NN 的 start-nn.sh 会一直
#   卡在"等待 ZooKeeper (zk1:2181)"。
#   因此本包直接挂载自定义 zoo.cfg（standalone 模式），不依赖镜像生成。
# ============================================================

dataDir=/data
dataLogDir=/datalog
tickTime=2000
initLimit=10
syncLimit=5
maxClientCnxns=60
autopurge.snapRetainCount=3
autopurge.purgeInterval=0

# 单节点 standalone（ZKFC 只需要一个仲裁节点；最小 HA 版取舍）
standaloneEnabled=true

# 客户端端口（NN/ZKFC 通过 ha.zookeeper.quorum=zk1:2181 连接）
clientPort=2181

# 管理端口(8080)在本场景无用，关闭减少噪音
admin.enableServer=false

# 允许 4lw 命令（ruok/stat），便于排查
4lw.commands.whitelist=*
